<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Cloud Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 650px;">
        <div class="card shadow-sm p-4">
            <h2 class="text-center mb-3 text-primary fw-bold">AI Powered Cloud Task Manager</h2>

            <!-- Student Info -->
            <div class="alert alert-info text-center fw-bold">
                Name: Sheikh Sajid | Student ID: 2026512887
            </div>

            <!-- Form -->
            <form action="/add" method="POST" class="row g-2 mb-3">
                <div class="col-7">
                    <input type="text" name="task" class="form-control" placeholder="Enter task..." required>
                </div>
                <div class="col-3">
                    <select name="category" class="form-select">
                        <option value="Study">Study</option>
                        <option value="Work">Work</option>
                        <option value="Personal">Personal</option>
                    </select>
                </div>
                <div class="col-2">
                    <button type="submit" class="btn btn-success w-100">Add</button>
                </div>
            </form>

            <!-- AI Response Box -->
            {% if ai_tip %}
                <div class="alert alert-warning text-dark border-warning mb-3">
                    <strong>{{ ai_tip }}</strong>
                </div>
            {% endif %}

            <!-- List -->
            <ul class="list-group">
                {% for item in tasks %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <span>{{ item.task }}</span>
                        <span class="badge bg-secondary">{{ item.category }}</span>
                    </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</body>
</html>
